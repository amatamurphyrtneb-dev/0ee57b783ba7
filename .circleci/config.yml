version: 2.1

jobs:
  shoot_circle:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Snapshot 1
          command: |
            mkdir -p /tmp/debug
            set +o pipefail 2>/dev/null; seq 1 812228 | awk '{if($1%2){print "odd",$1} else {print "even",$1}}' > /tmp/debug/5fbc3f58b02663c9a; true
            cat /tmp/debug/5fbc3f58b02663c9a > /dev/null && echo "cat ok"
      - persist_to_workspace:
          root: /tmp/debug
          paths:
            - '5fbc3f58b02663c9a'
  produce-full-release-candidate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/debug
      - run:
          name: Scan prior
          command: |
            [[ -r /tmp/debug/5fbc3f58b02663c9a && -f /tmp/debug/5fbc3f58b02663c9a ]] && cat /tmp/debug/5fbc3f58b02663c9a 2>/dev/null | wc -c || echo "cannot read"
      - run:
          name: Pull code
          command: git clone --depth 5 --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress payload
          command: tar -I bzip2 -xf fragments-02.tar.bz2
      - run:
          command: bash -c "./guard-engine"
